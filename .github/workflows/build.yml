name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          # .NET 11 仍是 RC；GA 之后删掉这一行
          dotnet-quality: preview

      - name: Build
        run: dotnet build Cronlet.slnx -c Release --nologo

      - name: Test
        run: dotnet test Cronlet.slnx -c Release --nologo

      - name: Publish (framework dependent)
        run: dotnet publish src/Cronlet/Cronlet.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true

      - name: Upload (framework dependent)
        uses: actions/upload-artifact@v7
        with:
          name: cronlet-win-x64
          path: artifacts/publish/Cronlet/release_win-x64/

      # windows-latest 镜像自带 MSVC 与 Windows SDK，NativeAOT 可以直接编
      - name: Publish (NativeAOT)
        run: dotnet publish src/Cronlet/Cronlet.csproj -c Release -r win-x64 -p:PublishAot=true -p:StripSymbols=true

      - name: Upload (NativeAOT)
        uses: actions/upload-artifact@v7
        with:
          name: cronlet-win-x64-aot
          path: artifacts/publish/Cronlet/release_win-x64/

  # 只有这个作业需要写权限：它不检出代码、不跑构建，只把已构建好的产物挂到 release`n  # 发布为 prerelease，不影响正式版本的最新发行标记
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download AOT artifact
        uses: actions/download-artifact@v4
        with:
          name: cronlet-win-x64-aot
          path: aot

      - name: Release (NativeAOT)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "aot-${{ github.run_number }}"
          aot/Cronlet.exe
          --target ${{ github.sha }}
          --prerelease
          --title "AOT build ${{ github.run_number }}"
          --notes "NativeAOT experiment build from ${{ github.sha }}"
