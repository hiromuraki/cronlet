name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          # .NET 11 仍是 RC；GA 之后删掉这一行
          dotnet-quality: preview

      - name: Build
        run: dotnet build Cronlet.slnx -c Release --nologo

      - name: Test
        run: dotnet test Cronlet.slnx -c Release --nologo

      - name: Publish
        run: dotnet publish src/Cronlet/Cronlet.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cronlet-win-x64
          path: artifacts/publish/Cronlet/release_win-x64/
