name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          # .NET 11 仍是 RC；GA 之后删掉这一行
          dotnet-quality: preview

      - name: Build
        run: dotnet build Cronlet.slnx -c Release --nologo

      - name: Test
        run: dotnet test Cronlet.slnx -c Release --nologo

      - name: Publish (framework dependent)
        run: dotnet publish src/Cronlet/Cronlet.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true

      - name: Upload (framework dependent)
        uses: actions/upload-artifact@v7
        with:
          name: cronlet-win-x64
          path: artifacts/publish/Cronlet/release_win-x64/

      # windows-latest 镜像自带 MSVC 与 Windows SDK，NativeAOT 可以直接编
      - name: Publish (NativeAOT)
        run: dotnet publish src/Cronlet/Cronlet.csproj -c Release -r win-x64 -p:PublishAot=true -p:StripSymbols=true

      - name: Upload (NativeAOT)
        uses: actions/upload-artifact@v7
        with:
          name: cronlet-win-x64-aot
          path: artifacts/publish/Cronlet/release_win-x64/

  # 只有这个作业需要写权限：它不检出代码、不跑构建，只把已构建好的产物挂到 release
  # 发布为 prerelease，不影响正式版本的最新发行标记
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download AOT artifact
        uses: actions/download-artifact@v8
        with:
          name: cronlet-win-x64-aot
          path: aot

      - name: Release (NativeAOT)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 重跑同一运行会得到相同的 run_number；已存在时校验指向后再复用，
          # 否则 gh release create 会对同标签报错，让整次工作流失败
          tag="aot-${{ github.run_number }}"

          # 用 release view 判断是否已存在：gh api 在 404 时会把错误 JSON 打到 stdout，
          # 直接拿它当 "existing" 会误判成"标签已存在但指向不对"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq .object.sha)"

            if [ "$existing" != "${GITHUB_SHA}" ]; then
              echo "::error::tag ${tag} points at ${existing}, expected ${GITHUB_SHA}"
              exit 1
            fi

            echo "release ${tag} already exists for ${GITHUB_SHA}; refreshing asset"
            gh release upload "$tag" aot/Cronlet.exe --clobber
            exit 0
          fi

          gh release create "$tag" aot/Cronlet.exe \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AOT build ${{ github.run_number }}" \
            --notes "NativeAOT build from $GITHUB_SHA"
