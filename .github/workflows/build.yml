name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          # .NET 11 仍是 RC；GA 之后删掉这一行
          dotnet-quality: preview

      - name: Build
        run: dotnet build Cronlet.slnx -c Release --nologo

      - name: Test
        run: dotnet test Cronlet.slnx -c Release --nologo

      - name: Publish (framework dependent)
        run: dotnet publish src/Cronlet/Cronlet.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true

      - name: Upload (framework dependent)
        uses: actions/upload-artifact@v7
        with:
          name: cronlet-win-x64
          path: artifacts/publish/Cronlet/release_win-x64/

      # windows-latest 镜像自带 MSVC 与 Windows SDK，NativeAOT 可以直接编
      - name: Publish (NativeAOT)
        run: dotnet publish src/Cronlet/Cronlet.csproj -c Release -r win-x64 -p:PublishAot=true -p:StripSymbols=true

      - name: Upload (NativeAOT)
        uses: actions/upload-artifact@v7
        with:
          name: cronlet-win-x64-aot
          path: artifacts/publish/Cronlet/release_win-x64/

  # 打 v* 标签才发正式 release：把已构建的两个产物挂到对应的 GitHub Release。
  # 重跑同一标签时改为覆盖资产，避免 gh release create 因标签已存在而失败。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download framework dependent artifact
        uses: actions/download-artifact@v8
        with:
          name: cronlet-win-x64
          path: dist/fdd

      - name: Download AOT artifact
        uses: actions/download-artifact@v8
        with:
          name: cronlet-win-x64-aot
          path: dist/aot

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # 两个包都叫 Cronlet.exe，Release 里不允许同名资产，按平台+类型重命名
          cp dist/fdd/Cronlet.exe "dist/cronlet-windows-amd64.exe"
          cp dist/aot/Cronlet.exe "dist/cronlet-windows-amd64-aot.exe"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/cronlet-windows-amd64.exe#Cronlet $TAG (framework dependent)" \
              "dist/cronlet-windows-amd64-aot.exe#Cronlet $TAG (NativeAOT)" \
              --clobber
            exit 0
          fi

          gh release create "$TAG" \
            "dist/cronlet-windows-amd64.exe#Cronlet $TAG (framework dependent)" \
            "dist/cronlet-windows-amd64-aot.exe#Cronlet $TAG (NativeAOT)" \
            --title "Cronlet $TAG" \
            --generate-notes